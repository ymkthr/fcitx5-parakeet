<?xml version="1.0" encoding="UTF-8"?>
<!-- Source for the panel icons; scripts/render-icons.sh fills @BG@, @BIRD@, @BADGE@ and renders hicolor/.
     A perched parakeet (the model's namesake); the language flag goes bottom-right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="4" y="4" width="120" height="120" rx="28" fill="@BG@"/>
  <g transform="@BIRD@">
    <!-- perch -->
    <path d="M14 106 H88" stroke="#7a4b2a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- tail feathers -->
    <path d="M46 92 L26 124 L36 122 L52 96 Z" fill="#2f8f5b"/>
    <path d="M54 94 L40 126 L49 124 L60 98 Z" fill="#3fae6e"/>
    <!-- body -->
    <ellipse cx="60" cy="72" rx="25" ry="30" fill="#6fcf6f"/>
    <!-- wing -->
    <path d="M40 60 C34 84 44 100 56 100 C50 88 50 72 54 58 Z" fill="#3fae6e"/>
    <!-- head -->
    <circle cx="66" cy="38" r="22" fill="#ffd93d"/>
    <!-- cheek spot -->
    <circle cx="74" cy="48" r="4.5" fill="#3d6fb4"/>
    <!-- beak -->
    <path d="M84 30 C96 32 96 44 88 50 C86 44 82 40 76 39 C80 36 82 33 84 30 Z" fill="#ff9d1c"/>
    <path d="M78 41 C84 44 88 48 88 50 C84 50 80 48 76 46 Z" fill="#e07b00"/>
    <!-- eye -->
    <circle cx="70" cy="32" r="5.5" fill="#ffffff"/>
    <circle cx="71" cy="32" r="3" fill="#1b1b1b"/>
    <!-- feet -->
    <path d="M56 100 L54 108 M62 100 L64 108" stroke="#e07b00" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  @BADGE@
</svg>
