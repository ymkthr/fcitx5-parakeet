[package]
name = "parakeetd"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Local speech-to-text daemon (sherpa-onnx + NVIDIA Parakeet) used by fcitx5-parakeet"
publish = false

[dependencies]
anyhow = "1"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
parking_lot = "0.12"
pipewire = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = "1"

[build-dependencies]
bindgen = "0.72"

[profile.release]
lto = "thin"
codegen-units = 1
