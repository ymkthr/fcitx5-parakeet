# voice-jad settings: copy to ~/.config/voice-jad/config.toml (every key is optional).

# Unix socket. Leave unset when started through systemd (voice-jad.socket owns it).
# socket_path = "/run/user/1000/voice-jad.sock"

# PipeWire source node name. Unset = the session's default source. While the
# node is absent (unplugged), WirePlumber records from the default source; the
# capture returns to this node when it reappears.
# target = "alsa_input.usb-R__DE_Microphones_R__DE_NT-USB_Mini_58311147-00.mono-fallback"

# A long dictation is entered in parts while you keep speaking: once this many
# seconds are not yet entered, the part up to the longest pause in their second
# half is transcribed (with correction) and entered, and recording continues.
# commit_after_seconds = 60

# Longest part without a pause, in seconds. Speech that never pauses is cut at
# its quietest moment within the last 10 s.
# max_seconds = 120

# A capture ends by itself after this many seconds in total, as if stopped.
# max_recording_seconds = 600

# Models to load at start-up. Loading takes about 2 s per model.
# preload = ["ja", "en"]

# Decode silence once after loading to avoid first-request runtime warm-up.
# warmup = true

# Silero VAD drops captures without speech instead of letting a model invent
# fillers such as "うん" from room noise. An empty string disables it.
# vad_model = "~/.local/share/voice-jad/models/silero_vad.onnx"

# While recording, re-transcribe the audio not yet entered this often
# (milliseconds) and show it as a preview near the cursor. The entered text
# still comes from transcribing each part as a whole. 0 disables the preview.
# partial_interval_ms = 500

[models.ja]
dir = "~/.local/share/voice-jad/models/sherpa-onnx-nemo-parakeet-tdt_ctc-0.6b-ja-35000-int8"
# kind = "nemo_ctc"
num_threads = 4

[models.en]
dir = "~/.local/share/voice-jad/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"
# kind = "nemo_transducer"
num_threads = 4

# "auto" decodes with both models. English wins when its mean token log
# probability reaches the threshold; otherwise the Japanese result is used.
# English sentences score above -0.1 and Japanese speech below -0.2. A lone
# English word ("OK", "No", "Bye") can score down to -0.4 and then comes out in
# katakana; a threshold nearer -0.35 keeps such words English but turns some
# short Japanese phrases into romaji.
[auto]
detector = "en"
fallback = "ja"
threshold = -0.15

# Japanese homophone correction: the jinen-v2-small kana-kanji model re-converts
# the transcript's reading, using the text before the cursor as context, and
# the TinySwallow-1.5B language model accepts each change it proposes only when
# the changed text is more likely by `judge_margin` nats. Disabled
# automatically when either model file is missing.
[correction]
# enabled = true
# model = "~/.local/share/voice-jad/models/jinen-v2-small/jinen-v2-small-Q5_K_M.gguf"
# judge_model = "~/.local/share/voice-jad/models/tinyswallow-1.5b/TinySwallow-1.5B-Q4_K_M.gguf"
# judge_margin = 2.0
# num_threads = 4
